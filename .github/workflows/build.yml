name: Build Executables

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: PlantUML-Client-Linux
          - os: macos-latest
            asset_name: PlantUML-Client-macOS.zip
          - os: windows-latest
            asset_name: PlantUML-Client-Windows.exe

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 requests
        pip install pyinstaller
        
    - name: Build executable
      run: python build.py
        
    - name: Package Windows
      if: matrix.os == 'windows-latest'
      run: |
        ren dist\PlantUML-Client.exe ${{ matrix.asset_name }}
        
    - name: Package Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        mv dist/PlantUML-Client dist/${{ matrix.asset_name }}

    - name: Package macOS
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r PlantUML-Client-macOS.zip PlantUML-Client.app
        mv PlantUML-Client-macOS.zip ${{ matrix.asset_name }}
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.asset_name }}
        retention-days: 7
        
    - name: Upload to Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event_name == 'release' && github.ref_name || 'latest' }}
        name: ${{ github.event_name == 'release' && github.ref_name || 'Latest Development Build' }}
        files: dist/${{ matrix.asset_name }}
        prerelease: ${{ github.event_name == 'push' }}
